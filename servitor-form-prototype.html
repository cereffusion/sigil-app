<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servitor Form — Prototype</title>
<style>
  :root {
    --bg: #0b0a10;
    --panel: #15131e;
    --ink: #e8e2d0;
    --gold: #c9a84c;
    --dim: #6f6a7e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 30%, #181425 0%, var(--bg) 70%);
    padding: 32px 18px 64px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-weight: normal; letter-spacing: 2px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-style: italic; margin: 0 0 28px; }
  label { display: block; color: var(--gold); font-size: 14px; letter-spacing: 1px; margin: 18px 0 6px; }
  input[type="text"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid #2c2840;
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border-radius: 6px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--gold); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 22px; }
  button {
    background: var(--gold);
    color: #1a160a;
    border: 1px solid var(--gold);
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 1px;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
  }
  button.secondary { background: transparent; border-color: #3a3550; color: var(--dim); }
  button.secondary:hover { background: #3a3550; color: var(--ink); }
  .palette { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .swatch {
    width: 26px; height: 26px; padding: 0; border-radius: 50%;
    border: 2px solid #3a3550; cursor: pointer;
  }
  .swatch.active { border-color: var(--ink); transform: scale(1.12); }
  .output {
    display: flex; gap: 28px; flex-wrap: wrap; margin-top: 36px;
    align-items: flex-start;
  }
  .glyph {
    background: var(--panel); border: 1px solid #2c2840; border-radius: 12px;
    padding: 12px; flex: 0 0 auto;
  }
  .glyph svg { display: block; width: 320px; height: 320px; max-width: 70vw; }
  .card { flex: 1 1 240px; min-width: 240px; }
  .card .name { font-size: 26px; letter-spacing: 2px; color: var(--gold); margin: 6px 0 14px; }
  .card .desc { font-size: 19px; line-height: 1.5; }
  .card .meta { color: var(--dim); font-size: 14px; margin-top: 18px; line-height: 1.6; }
  .hidden { display: none; }
  .gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px; margin-top: 36px;
  }
  .tile {
    background: var(--panel); border: 1px solid #2c2840; border-radius: 10px;
    padding: 8px; text-align: center;
  }
  .tile svg { display: block; width: 100%; height: auto; border-radius: 6px; }
  .tile .lbl { color: var(--dim); font-size: 13px; letter-spacing: 1px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Servitor Form</h1>
  <p class="sub">prototype · text + seal-form from one seed · local only</p>

  <label for="name">Name</label>
  <input type="text" id="name" placeholder="e.g. Vael" autocomplete="off">

  <label for="job">Its one-line job</label>
  <input type="text" id="job" placeholder="e.g. help me notice the right person" autocomplete="off">

  <label>Color</label>
  <div class="palette" id="palette">
    <button class="swatch active" data-ink="#e8e2d0" data-accent="#c9a84c" style="background:#e8e2d0" title="Bone &amp; Gold"></button>
    <button class="swatch" data-ink="#c9a84c" data-accent="#8a6d2f" style="background:#c9a84c" title="Gold"></button>
    <button class="swatch" data-ink="#c0392b" data-accent="#7a241b" style="background:#c0392b" title="Crimson"></button>
    <button class="swatch" data-ink="#9b59d0" data-accent="#5e3580" style="background:#9b59d0" title="Violet"></button>
    <button class="swatch" data-ink="#3ec6b8" data-accent="#1f7a71" style="background:#3ec6b8" title="Teal"></button>
    <button class="swatch" data-ink="glitter" data-accent="#e8b6ff" style="background:linear-gradient(135deg,#ffd1ec,#e8b6ff 30%,#b5e8ff 60%,#ffe9b5)" title="Glitter"></button>
    <button class="swatch" data-ink="#ff2d95" data-accent="#b01060" style="background:#ff2d95" title="Hot Pink"></button>
  </div>

  <div class="row">
    <button id="generate">Generate form</button>
    <button id="reroll" class="secondary">Reroll</button>
    <button id="save" class="secondary">Save SVG</button>
    <button id="showall" class="secondary">Show all</button>
  </div>

  <div class="gallery hidden" id="gallery"></div>

  <div class="output hidden" id="output">
    <div class="glyph"><svg id="svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="card">
      <div class="name" id="out-name"></div>
      <div class="desc" id="out-desc"></div>
      <div class="meta" id="out-meta"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var SVGNS = 'http://www.w3.org/2000/svg';

  // ---- seeded RNG (same as Sigil Forge) ----
  function hashString(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = Math.random;
  function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
  function range(lo, hi) { return lo + rng() * (hi - lo); }
  function rint(lo, hi) { return Math.floor(range(lo, hi + 1)); }

  // ---- job -> behavior category ----
  var KEYWORDS = {
    seek:    ['meet', 'find', 'love', 'partner', 'attract', 'opportun', 'connect', 'date', 'friend', 'notice', 'right person'],
    gather:  ['money', 'wealth', 'abund', 'work', 'job', 'career', 'sell', 'client', 'success', 'win', 'draw'],
    guard:   ['protect', 'calm', 'focus', 'steady', 'ground', 'shield', 'safe', 'peace', 'sleep', 'anxiet', 'still'],
    release: ['release', 'let go', 'heal', 'grief', 'banish', 'forgive', 'quit', 'stop', 'end', 'cleanse', 'free']
  };
  function categoryOf(job) {
    var j = (job || '').toLowerCase();
    for (var cat in KEYWORDS) {
      for (var i = 0; i < KEYWORDS[cat].length; i++) {
        if (j.indexOf(KEYWORDS[cat][i]) !== -1) return cat;
      }
    }
    return 'default';
  }

  // archetype affinity + behavior phrasing per category
  var CATEGORY = {
    seek:    { arch: ['bird', 'thread', 'orb', 'spiral', 'eye', 'fox', 'moth', 'rose', 'key'],            verbs: ['scouts ahead and returns', 'follows the scent of what you named', 'drifts steadily toward its target'] },
    gather:  { arch: ['bird', 'knot', 'orb', 'web', 'tree', 'fox', 'spider', 'stag', 'key', 'bee'],       verbs: ['gathers what is owed and brings it back', 'draws opportunity inward', 'returns heavy with it'] },
    guard:   { arch: ['star', 'orb', 'flame', 'eye', 'tree', 'serpent', 'stag', 'spider', 'owl', 'cat'],  verbs: ['stands watch, unmoving', 'holds a steady light', 'keeps the boundary you set'] },
    release: { arch: ['flame', 'thread', 'orb', 'spiral', 'crescent', 'serpent', 'moth', 'wave'],         verbs: ['carries the weight away and dissolves', 'burns it down to nothing', 'lets it drift out of you'] },
    default: { arch: ['orb', 'star', 'knot', 'crescent', 'web', 'stag', 'rose', 'cat', 'bee', 'wave', 'owl'], verbs: ['does its quiet work and waits', 'tends to the task without rest'] }
  };

  var MATERIALS = ['gold', 'silver', 'smoke', 'ember', 'violet', 'pearl', 'iron', 'moonlit', 'copper', 'ink-black', 'emerald'];
  var ARCH_NOUN = {
    orb: 'orb', flame: 'flame', knot: 'knotted coil', star: 'many-pointed star',
    bird: 'bird', thread: 'reaching thread', spiral: 'turning spiral',
    eye: 'open eye', tree: 'rooted tree', web: 'woven web', crescent: 'crescent',
    fox: 'fox', serpent: 'coiled serpent', stag: 'antlered stag', moth: 'pale moth', spider: 'patient spider',
    rose: 'blooming rose', key: 'turning key', owl: 'watchful owl', wave: 'rolling wave',
    bee: 'golden bee', cat: 'watching cat'
  };

  // ---- current selection state ----
  var palette = { ink: '#e8e2d0', accent: '#c9a84c' };
  var nonce = 0;

  // ---- SVG helpers ----
  function el(name, attrs) {
    var e = document.createElementNS(SVGNS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function strokeColor(svg, uid) {
    if (palette.ink !== 'glitter') return palette.ink;
    var id = 'grad-' + (uid || 'main');
    var defs = el('defs', {});
    var grad = el('linearGradient', { id: id, x1: '0', y1: '0', x2: '1', y2: '1' });
    [['0%', '#ffd1ec'], ['30%', '#e8b6ff'], ['60%', '#b5e8ff'], ['100%', '#ffe9b5']].forEach(function (s) {
      grad.appendChild(el('stop', { offset: s[0], 'stop-color': s[1] }));
    });
    defs.appendChild(grad);
    svg.appendChild(defs);
    return 'url(#' + id + ')';
  }

  // draw one archetype into a fresh svg, seeded deterministically
  function renderForm(svg, archetype, seed, uid) {
    rng = mulberry32(seed);
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.appendChild(el('rect', { x: 0, y: 0, width: 400, height: 400, fill: '#15131e' }));
    var stroke = strokeColor(svg, uid);
    DRAW[archetype](svg, stroke);
    if (palette.ink === 'glitter') {
      for (var s = 0; s < 14; s++) {
        svg.appendChild(el('circle', { cx: range(30, 370), cy: range(30, 370), r: range(0.8, 2), fill: '#ffffff' }));
      }
    }
  }

  // ---- archetype drawing (procedural, seeded, no animation) ----
  var CX = 200, CY = 200;

  function drawOrb(svg, stroke) {
    var rings = rint(2, 4);
    for (var i = 0; i < rings; i++) {
      var r = 60 + i * (90 / rings) + range(-6, 6);
      svg.appendChild(el('circle', { cx: CX, cy: CY, r: r, fill: 'none', stroke: stroke, 'stroke-width': range(2, 4) }));
    }
    var dots = rint(8, 18);
    for (var d = 0; d < dots; d++) {
      var a = range(0, Math.PI * 2), rr = range(20, 150);
      svg.appendChild(el('circle', { cx: CX + Math.cos(a) * rr, cy: CY + Math.sin(a) * rr, r: range(1.5, 3.5), fill: palette.accent }));
    }
  }

  function drawStar(svg, stroke) {
    var points = rint(5, 9), outer = 150, inner = outer * range(0.4, 0.6);
    var d = '';
    for (var i = 0; i < points * 2; i++) {
      var r = (i % 2 === 0) ? outer : inner;
      r += range(-8, 8);
      var a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      d += (i === 0 ? 'M' : 'L') + (CX + Math.cos(a) * r).toFixed(1) + ' ' + (CY + Math.sin(a) * r).toFixed(1) + ' ';
    }
    d += 'Z';
    svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': range(2.5, 4), 'stroke-linejoin': 'round' }));
  }

  function drawKnot(svg, stroke) {
    var k = pick([2, 3, 4]), phase = range(0, Math.PI), amp = range(40, 70), base = range(70, 100);
    var d = '', steps = 200;
    for (var i = 0; i <= steps; i++) {
      var t = (i / steps) * Math.PI * 2;
      var r = base + amp * Math.sin(k * t + phase);
      var x = CX + Math.cos(t) * r, y = CY + Math.sin(t) * r;
      d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    d += 'Z';
    svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': range(2, 3.5) }));
  }

  function drawFlame(svg, stroke) {
    var flames = rint(1, 2);
    for (var f = 0; f < flames; f++) {
      var w = range(50, 80) - f * 18, h = range(150, 200) - f * 40;
      var top = CY - h / 2, bot = CY + h / 2, sway = range(-25, 25);
      var d = 'M' + CX + ' ' + bot +
        ' C' + (CX - w) + ' ' + (bot - h * 0.4) + ' ' + (CX - w * 0.4) + ' ' + (top + h * 0.3) + ' ' + (CX + sway) + ' ' + top +
        ' C' + (CX + w * 0.4) + ' ' + (top + h * 0.3) + ' ' + (CX + w) + ' ' + (bot - h * 0.4) + ' ' + CX + ' ' + bot + ' Z';
      svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': range(2.5, 4) }));
    }
  }

  function drawBird(svg, stroke) {
    var birds = rint(1, 3);
    for (var b = 0; b < birds; b++) {
      var span = range(70, 130) - b * 18;
      var bx = CX + range(-50, 50), by = CY - 60 + b * 55 + range(-10, 10);
      var dip = range(15, 35);
      var d = 'M' + (bx - span) + ' ' + by +
        ' Q' + (bx - span / 2) + ' ' + (by - dip) + ' ' + bx + ' ' + by +
        ' Q' + (bx + span / 2) + ' ' + (by - dip) + ' ' + (bx + span) + ' ' + by;
      svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': range(2.5, 4), 'stroke-linecap': 'round' }));
    }
  }

  function drawThread(svg, stroke) {
    var amp = range(35, 70), waves = range(2.5, 4), phase = range(0, Math.PI);
    var d = '', steps = 160, top = 40, bot = 360;
    for (var i = 0; i <= steps; i++) {
      var ty = top + (bot - top) * (i / steps);
      var tx = CX + Math.sin((i / steps) * Math.PI * waves + phase) * amp * (i / steps);
      d += (i === 0 ? 'M' : 'L') + tx.toFixed(1) + ' ' + ty.toFixed(1) + ' ';
    }
    svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': range(2.5, 4), 'stroke-linecap': 'round' }));
    // a small seeking node at the end
    var ey = bot, ex = CX + Math.sin(Math.PI * waves + phase) * amp;
    svg.appendChild(el('circle', { cx: ex, cy: ey, r: range(4, 7), fill: palette.accent }));
  }

  function drawSpiral(svg, stroke) {
    var turns = range(3, 5.5), maxR = 150, steps = 280, jit = range(0, 5);
    var d = '';
    for (var i = 0; i <= steps; i++) {
      var t = (i / steps) * turns * Math.PI * 2;
      var r = maxR * (i / steps) + (jit ? Math.sin(t * 3) * jit : 0);
      var x = CX + Math.cos(t) * r, y = CY + Math.sin(t) * r;
      d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': range(2, 3.5), 'stroke-linecap': 'round' }));
    svg.appendChild(el('circle', { cx: CX, cy: CY, r: range(3, 6), fill: palette.accent }));
  }

  function drawEye(svg, stroke) {
    var w = range(150, 185), h = range(70, 100);
    var lx = CX - w / 2, rx = CX + w / 2;
    var d = 'M' + lx + ' ' + CY +
      ' Q' + CX + ' ' + (CY - h) + ' ' + rx + ' ' + CY +
      ' Q' + CX + ' ' + (CY + h) + ' ' + lx + ' ' + CY + ' Z';
    svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': range(2.5, 4) }));
    var iris = range(28, 40);
    svg.appendChild(el('circle', { cx: CX, cy: CY, r: iris, fill: 'none', stroke: stroke, 'stroke-width': range(2, 3) }));
    svg.appendChild(el('circle', { cx: CX, cy: CY, r: range(6, 11), fill: palette.accent }));
    var rays = rint(6, 12);
    for (var i = 0; i < rays; i++) {
      var a = (i / rays) * Math.PI * 2;
      var r0 = iris + 6, r1 = iris + range(10, 22);
      svg.appendChild(el('line', {
        x1: CX + Math.cos(a) * r0, y1: CY + Math.sin(a) * r0,
        x2: CX + Math.cos(a) * r1, y2: CY + Math.sin(a) * r1,
        stroke: stroke, 'stroke-width': range(1.5, 2.5), 'stroke-linecap': 'round'
      }));
    }
  }

  function drawTree(svg, stroke) {
    function branch(x, y, len, ang, depth) {
      if (depth === 0 || len < 8) return;
      var x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
      svg.appendChild(el('line', { x1: x, y1: y, x2: x2, y2: y2, stroke: stroke, 'stroke-width': Math.max(1.5, depth * 1.1), 'stroke-linecap': 'round' }));
      var spread = range(0.4, 0.8), shrink = range(0.62, 0.74);
      branch(x2, y2, len * shrink, ang - spread, depth - 1);
      branch(x2, y2, len * shrink, ang + spread, depth - 1);
      if (rng() > 0.6) branch(x2, y2, len * shrink * 0.8, ang + range(-0.2, 0.2), depth - 1);
    }
    var depth = rint(4, 6), trunk = range(58, 78);
    branch(CX, 330, trunk, -Math.PI / 2, depth);     // canopy upward
    branch(CX, 330, trunk * 0.55, Math.PI / 2, depth - 2); // roots downward
  }

  function drawWeb(svg, stroke) {
    var spokes = rint(6, 11), rings = rint(3, 5), maxR = 150;
    var ang = [];
    for (var s = 0; s < spokes; s++) ang.push((s / spokes) * Math.PI * 2 + range(-0.06, 0.06));
    ang.forEach(function (a) {
      svg.appendChild(el('line', { x1: CX, y1: CY, x2: CX + Math.cos(a) * maxR, y2: CY + Math.sin(a) * maxR, stroke: stroke, 'stroke-width': range(1.2, 2) }));
    });
    for (var ri = 1; ri <= rings; ri++) {
      var r = maxR * (ri / rings) * range(0.92, 1.0);
      var d = '';
      for (var i = 0; i <= spokes; i++) {
        var a2 = ang[i % spokes];
        d += (i === 0 ? 'M' : 'L') + (CX + Math.cos(a2) * r).toFixed(1) + ' ' + (CY + Math.sin(a2) * r).toFixed(1) + ' ';
      }
      svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': range(1.2, 2) }));
    }
    svg.appendChild(el('circle', { cx: CX, cy: CY, r: range(3, 5), fill: palette.accent }));
  }

  function drawCrescent(svg, stroke) {
    var R = range(120, 145), offset = range(45, 70), tilt = range(-0.5, 0.5);
    var ox = Math.cos(tilt) * offset, oy = Math.sin(tilt) * offset;
    // lit sliver: outer circle arc, returned by a wider inner arc that bites it
    var crescentPath = 'M' + (CX + ox) + ' ' + (CY - R + oy) +
      ' A' + R + ' ' + R + ' 0 1 1 ' + (CX + ox) + ' ' + (CY + R + oy) +
      ' A' + (R + offset) + ' ' + (R + offset) + ' 0 0 0 ' + (CX + ox) + ' ' + (CY - R + oy) + ' Z';
    svg.appendChild(el('path', { d: crescentPath, fill: 'none', stroke: stroke, 'stroke-width': range(2.5, 4) }));
    var stars = rint(3, 6);
    for (var i = 0; i < stars; i++) {
      var sx = CX + range(40, 150), sy = CY + range(-150, 150);
      svg.appendChild(el('circle', { cx: sx, cy: sy, r: range(1.5, 3), fill: palette.accent }));
    }
  }

  function line(svg, x1, y1, x2, y2, stroke, w) {
    svg.appendChild(el('line', { x1: x1, y1: y1, x2: x2, y2: y2, stroke: stroke, 'stroke-width': w, 'stroke-linecap': 'round' }));
  }

  function drawFox(svg, stroke) {
    var w = range(2.5, 3.5), j = range(-6, 6);
    var earY = range(70, 95), chin = range(290, 320), cheek = range(70, 90);
    // ears
    var d = 'M' + (CX - cheek) + ' ' + (earY + 50) + ' L' + (CX - cheek + 12) + ' ' + earY + ' L' + (CX - 22) + ' ' + (earY + 40);
    d += ' M' + (CX + cheek) + ' ' + (earY + 50) + ' L' + (CX + cheek - 12) + ' ' + earY + ' L' + (CX + 22) + ' ' + (earY + 40);
    // face: cheeks down to a pointed snout
    d += ' M' + (CX - cheek) + ' ' + (earY + 50) + ' L' + (CX - cheek + 18) + ' ' + (cheek + 120 + j) + ' L' + CX + ' ' + chin +
         ' L' + (CX + cheek - 18) + ' ' + (cheek + 120 - j) + ' L' + (CX + cheek) + ' ' + (earY + 50);
    svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    // eyes + nose
    svg.appendChild(el('circle', { cx: CX - 32, cy: cheek + 110, r: range(3, 5), fill: palette.accent }));
    svg.appendChild(el('circle', { cx: CX + 32, cy: cheek + 110, r: range(3, 5), fill: palette.accent }));
    svg.appendChild(el('circle', { cx: CX, cy: chin - 14, r: range(3.5, 5.5), fill: palette.accent }));
  }

  function drawSerpent(svg, stroke) {
    var turns = range(2.2, 3.2), base = range(120, 145), steps = 240, phase = range(0, Math.PI);
    var d = '', hx = 0, hy = 0, px = 0, py = 0;
    for (var i = 0; i <= steps; i++) {
      var t = (i / steps) * turns * Math.PI * 2 + phase;
      var r = base * (1 - 0.72 * (i / steps));
      var x = CX + Math.cos(t) * r, y = CY + Math.sin(t) * r;
      if (i === 0) { hx = x; hy = y; }
      if (i === 1) { px = x; py = y; }
      d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': range(3, 4.5), 'stroke-linecap': 'round' }));
    // head + forked tongue, pointing away from the body
    var ang = Math.atan2(hy - py, hx - px);
    svg.appendChild(el('circle', { cx: hx, cy: hy, r: range(7, 10), fill: stroke === palette.ink ? palette.ink : palette.accent }));
    var tl = range(16, 24);
    line(svg, hx, hy, hx + Math.cos(ang - 0.18) * tl, hy + Math.sin(ang - 0.18) * tl, palette.accent, 2);
    line(svg, hx, hy, hx + Math.cos(ang + 0.18) * tl, hy + Math.sin(ang + 0.18) * tl, palette.accent, 2);
  }

  function drawStag(svg, stroke) {
    var w = range(2.5, 3.5), topY = range(165, 185), muzzle = range(305, 330);
    // head: a narrow shape from brow down to muzzle
    var hw = range(34, 46);
    var d = 'M' + (CX - hw) + ' ' + topY + ' L' + (CX - hw * 0.45) + ' ' + (muzzle - 30) +
            ' L' + CX + ' ' + muzzle + ' L' + (CX + hw * 0.45) + ' ' + (muzzle - 30) +
            ' L' + (CX + hw) + ' ' + topY;
    svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    // antlers: recursive branching upward from each brow
    function branch(x, y, len, ang, depth) {
      if (depth === 0 || len < 7) return;
      var x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
      line(svg, x, y, x2, y2, stroke, Math.max(1.5, depth));
      branch(x2, y2, len * range(0.6, 0.72), ang - range(0.5, 0.8), depth - 1);
      if (rng() > 0.4) branch(x2, y2, len * range(0.5, 0.65), ang + range(0.2, 0.5), depth - 1);
    }
    var depth = rint(3, 5), alen = range(40, 55);
    branch(CX - hw + 6, topY, alen, -Math.PI / 2 - 0.5, depth);
    branch(CX + hw - 6, topY, alen, -Math.PI / 2 + 0.5, depth);
    svg.appendChild(el('circle', { cx: CX - 16, cy: topY + 55, r: range(3, 4.5), fill: palette.accent }));
    svg.appendChild(el('circle', { cx: CX + 16, cy: topY + 55, r: range(3, 4.5), fill: palette.accent }));
  }

  function drawMoth(svg, stroke) {
    var w = range(2.2, 3.2);
    var uw = range(95, 125), uh = range(70, 95), lw = range(60, 80), lh = range(55, 75);
    var bodyTop = CY - 70, bodyBot = CY + 80;
    [-1, 1].forEach(function (s) {
      // upper wing
      svg.appendChild(el('path', { d: 'M' + CX + ' ' + (CY - 40) +
        ' Q' + (CX + s * uw) + ' ' + (CY - 40 - uh) + ' ' + (CX + s * uw * 0.6) + ' ' + (CY + 5) +
        ' Q' + (CX + s * uw * 0.3) + ' ' + (CY - 10) + ' ' + CX + ' ' + (CY - 40) + ' Z',
        fill: 'none', stroke: stroke, 'stroke-width': w }));
      // lower wing
      svg.appendChild(el('path', { d: 'M' + CX + ' ' + (CY + 5) +
        ' Q' + (CX + s * lw) + ' ' + (CY + 5 + lh) + ' ' + (CX + s * lw * 0.4) + ' ' + (CY + 60) +
        ' Q' + (CX + s * lw * 0.2) + ' ' + (CY + 40) + ' ' + CX + ' ' + (CY + 5) + ' Z',
        fill: 'none', stroke: stroke, 'stroke-width': w }));
      // eyespot
      svg.appendChild(el('circle', { cx: CX + s * uw * 0.4, cy: CY - 35, r: range(4, 7), fill: palette.accent }));
      // antenna
      svg.appendChild(el('path', { d: 'M' + CX + ' ' + bodyTop + ' Q' + (CX + s * 30) + ' ' + (bodyTop - 35) + ' ' + (CX + s * 45) + ' ' + (bodyTop - 28),
        fill: 'none', stroke: stroke, 'stroke-width': 1.6, 'stroke-linecap': 'round' }));
    });
    line(svg, CX, bodyTop, CX, bodyBot, stroke, range(3.5, 5));
  }

  function drawSpider(svg, stroke) {
    var w = range(2, 3);
    var ceph = CY - 18, abdo = CY + 30;
    svg.appendChild(el('ellipse', { cx: CX, cy: ceph, rx: range(16, 22), ry: range(18, 26), fill: 'none', stroke: stroke, 'stroke-width': w }));
    svg.appendChild(el('ellipse', { cx: CX, cy: abdo, rx: range(24, 32), ry: range(30, 42), fill: 'none', stroke: stroke, 'stroke-width': w }));
    [-1, 1].forEach(function (s) {
      for (var i = 0; i < 4; i++) {
        var y = ceph - 6 + i * 14;
        var spread = range(0.1, 0.35) + i * 0.1;
        var midx = CX + s * range(55, 75), midy = y - range(30, 50);
        var endx = midx + s * range(40, 60), endy = y + range(20, 45);
        line(svg, CX + s * 14, y, midx, midy, stroke, w);
        line(svg, midx, midy, endx, endy, stroke, w);
      }
    });
    svg.appendChild(el('circle', { cx: CX - 6, cy: ceph - 6, r: range(2, 3), fill: palette.accent }));
    svg.appendChild(el('circle', { cx: CX + 6, cy: ceph - 6, r: range(2, 3), fill: palette.accent }));
  }

  function drawRose(svg, stroke) {
    var k = pick([3, 4, 5, 6]), R = range(135, 150), steps = 360;
    function rhodonea(amp, rot) {
      var d = '';
      for (var i = 0; i <= steps; i++) {
        var th = (i / steps) * Math.PI * 2;
        var r = amp * Math.cos(k * th);
        d += (i === 0 ? 'M' : 'L') + (CX + r * Math.cos(th + rot)).toFixed(1) + ' ' + (CY + r * Math.sin(th + rot)).toFixed(1) + ' ';
      }
      return d;
    }
    svg.appendChild(el('path', { d: rhodonea(R, 0), fill: 'none', stroke: stroke, 'stroke-width': range(2, 3) }));
    svg.appendChild(el('path', { d: rhodonea(R * 0.62, Math.PI / k), fill: 'none', stroke: stroke, 'stroke-width': range(1.8, 2.6) }));
    svg.appendChild(el('circle', { cx: CX, cy: CY, r: range(6, 10), fill: palette.accent }));
  }

  function drawKey(svg, stroke) {
    var w = range(4, 6), bowY = CY - 90, bowR = range(34, 44), shaftBot = CY + 125;
    svg.appendChild(el('circle', { cx: CX, cy: bowY, r: bowR, fill: 'none', stroke: stroke, 'stroke-width': w }));
    svg.appendChild(el('circle', { cx: CX, cy: bowY, r: bowR * range(0.4, 0.55), fill: 'none', stroke: stroke, 'stroke-width': w * 0.7 }));
    line(svg, CX, bowY + bowR, CX, shaftBot, stroke, w);
    var teeth = rint(2, 4);
    for (var i = 0; i < teeth; i++) {
      var ty = shaftBot - i * range(16, 22);
      line(svg, CX, ty, CX + range(18, 30), ty, stroke, w);
    }
    svg.appendChild(el('circle', { cx: CX, cy: bowY, r: range(2, 3.5), fill: palette.accent }));
  }

  function drawOwl(svg, stroke) {
    var w = range(2.5, 3.5), hy = CY - 30, hr = range(72, 85);
    line(svg, CX - hr * 0.5, hy - hr * 0.7, CX - hr * 0.72, hy - hr * 1.05, stroke, w);
    line(svg, CX - hr * 0.3, hy - hr * 0.85, CX - hr * 0.72, hy - hr * 1.05, stroke, w);
    line(svg, CX + hr * 0.5, hy - hr * 0.7, CX + hr * 0.72, hy - hr * 1.05, stroke, w);
    line(svg, CX + hr * 0.3, hy - hr * 0.85, CX + hr * 0.72, hy - hr * 1.05, stroke, w);
    svg.appendChild(el('circle', { cx: CX, cy: hy, r: hr, fill: 'none', stroke: stroke, 'stroke-width': w }));
    var er = range(24, 30), ex = range(30, 38);
    [-1, 1].forEach(function (s) {
      svg.appendChild(el('circle', { cx: CX + s * ex, cy: hy - 6, r: er, fill: 'none', stroke: stroke, 'stroke-width': w }));
      svg.appendChild(el('circle', { cx: CX + s * ex, cy: hy - 6, r: range(7, 11), fill: palette.accent }));
    });
    svg.appendChild(el('path', { d: 'M' + CX + ' ' + (hy + 6) + ' L' + (CX - 9) + ' ' + (hy + 20) + ' L' + (CX + 9) + ' ' + (hy + 20) + ' Z', fill: 'none', stroke: stroke, 'stroke-width': w, 'stroke-linejoin': 'round' }));
    svg.appendChild(el('ellipse', { cx: CX, cy: hy + hr + 50, rx: hr * 0.85, ry: range(70, 88), fill: 'none', stroke: stroke, 'stroke-width': w }));
    for (var i = 0; i < 3; i++) {
      var fy = hy + hr + 32 + i * 22;
      svg.appendChild(el('path', { d: 'M' + (CX - 25) + ' ' + fy + ' L' + CX + ' ' + (fy + 10) + ' L' + (CX + 25) + ' ' + fy, fill: 'none', stroke: stroke, 'stroke-width': 1.6 }));
    }
  }

  function drawWave(svg, stroke) {
    var w = range(2.5, 3.5), layers = rint(2, 3);
    for (var L = 0; L < layers; L++) {
      var y = CY - 20 + L * 38, amp = range(16, 28) - L * 3, waves = range(2, 3.2), d = '';
      for (var i = 0; i <= 160; i++) {
        var x = 40 + 320 * (i / 160);
        d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + (y + Math.sin((i / 160) * Math.PI * 2 * waves) * amp).toFixed(1) + ' ';
      }
      svg.appendChild(el('path', { d: d, fill: 'none', stroke: stroke, 'stroke-width': w, 'stroke-linecap': 'round' }));
    }
    var ccx = range(280, 320), ccy = CY - 55, d2 = '', turns = range(1.2, 1.8);
    for (var i = 0; i <= 120; i++) {
      var t = (i / 120) * turns * Math.PI * 2, r = 4 + (i / 120) * 30;
      d2 += (i === 0 ? 'M' : 'L') + (ccx + Math.cos(t) * r).toFixed(1) + ' ' + (ccy + Math.sin(t) * r).toFixed(1) + ' ';
    }
    svg.appendChild(el('path', { d: d2, fill: 'none', stroke: stroke, 'stroke-width': w, 'stroke-linecap': 'round' }));
  }

  function drawBee(svg, stroke) {
    var w = range(2.2, 3), headY = CY - 70, abY = CY + 15, abrx = range(34, 42), abry = range(52, 62);
    [-1, 1].forEach(function (s) {
      var wing = el('ellipse', { cx: CX + s * 40, cy: CY - 35, rx: range(28, 38), ry: range(16, 22), fill: 'none', stroke: stroke, 'stroke-width': w * 0.8 });
      wing.setAttribute('transform', 'rotate(' + (s * 25) + ' ' + (CX + s * 40) + ' ' + (CY - 35) + ')');
      svg.appendChild(wing);
    });
    svg.appendChild(el('ellipse', { cx: CX, cy: abY, rx: abrx, ry: abry, fill: 'none', stroke: stroke, 'stroke-width': w }));
    for (var i = 0; i < 3; i++) {
      var sy = abY - 22 + i * 22;
      var half = Math.sqrt(Math.max(0, 1 - Math.pow((sy - abY) / abry, 2))) * abrx;
      line(svg, CX - half, sy, CX + half, sy, palette.accent, w);
    }
    svg.appendChild(el('circle', { cx: CX, cy: headY, r: range(16, 20), fill: 'none', stroke: stroke, 'stroke-width': w }));
    line(svg, CX - 6, headY - 12, CX - 16, headY - 30, stroke, 1.6);
    line(svg, CX + 6, headY - 12, CX + 16, headY - 30, stroke, 1.6);
    svg.appendChild(el('path', { d: 'M' + (CX - 6) + ' ' + (abY + abry) + ' L' + CX + ' ' + (abY + abry + 16) + ' L' + (CX + 6) + ' ' + (abY + abry) + ' Z', fill: 'none', stroke: stroke, 'stroke-width': w }));
  }

  function drawCat(svg, stroke) {
    var w = range(2.5, 3.5), hy = CY - 10, hw = range(70, 82);
    svg.appendChild(el('path', { d: 'M' + (CX - hw * 0.7) + ' ' + (hy - hw * 0.55) + ' L' + (CX - hw * 0.5) + ' ' + (hy - hw * 1.05) + ' L' + (CX - hw * 0.15) + ' ' + (hy - hw * 0.6) + ' Z', fill: 'none', stroke: stroke, 'stroke-width': w, 'stroke-linejoin': 'round' }));
    svg.appendChild(el('path', { d: 'M' + (CX + hw * 0.7) + ' ' + (hy - hw * 0.55) + ' L' + (CX + hw * 0.5) + ' ' + (hy - hw * 1.05) + ' L' + (CX + hw * 0.15) + ' ' + (hy - hw * 0.6) + ' Z', fill: 'none', stroke: stroke, 'stroke-width': w, 'stroke-linejoin': 'round' }));
    svg.appendChild(el('ellipse', { cx: CX, cy: hy, rx: hw, ry: hw * 0.92, fill: 'none', stroke: stroke, 'stroke-width': w }));
    [-1, 1].forEach(function (s) {
      var ex = CX + s * 32;
      svg.appendChild(el('path', { d: 'M' + (ex - 16) + ' ' + hy + ' Q' + ex + ' ' + (hy - 14) + ' ' + (ex + 16) + ' ' + hy + ' Q' + ex + ' ' + (hy + 14) + ' ' + (ex - 16) + ' ' + hy + ' Z', fill: 'none', stroke: stroke, 'stroke-width': w }));
      svg.appendChild(el('ellipse', { cx: ex, cy: hy, rx: range(2.5, 4), ry: range(7, 10), fill: palette.accent }));
    });
    svg.appendChild(el('path', { d: 'M' + (CX - 7) + ' ' + (hy + 24) + ' L' + (CX + 7) + ' ' + (hy + 24) + ' L' + CX + ' ' + (hy + 33) + ' Z', fill: palette.accent }));
    line(svg, CX, hy + 33, CX, hy + 40, stroke, 1.6);
    [-1, 1].forEach(function (s) {
      for (var i = 0; i < 3; i++) line(svg, CX + s * 12, hy + 30, CX + s * (hw + 30), hy + 26 + i * 9, stroke, 1.3);
    });
  }

  var DRAW = {
    orb: drawOrb, star: drawStar, knot: drawKnot, flame: drawFlame, bird: drawBird, thread: drawThread,
    spiral: drawSpiral, eye: drawEye, tree: drawTree, web: drawWeb, crescent: drawCrescent,
    fox: drawFox, serpent: drawSerpent, stag: drawStag, moth: drawMoth, spider: drawSpider,
    rose: drawRose, key: drawKey, owl: drawOwl, wave: drawWave, bee: drawBee, cat: drawCat
  };

  // ---- generate ----
  function generate() {
    var name = (document.getElementById('name').value || '').trim();
    var job = (document.getElementById('job').value || '').trim();
    if (!name) { document.getElementById('name').focus(); return; }

    var seed = hashString(name + '|' + job + '|' + nonce);
    rng = mulberry32(seed);

    var cat = categoryOf(job);
    var spec = CATEGORY[cat];
    // single seed drives BOTH text and svg, in fixed draw order
    var archetype = pick(spec.arch);
    var material = pick(MATERIALS);
    var behavior = pick(spec.verbs);

    // text
    document.getElementById('out-name').textContent = name;
    document.getElementById('out-desc').textContent =
      name + ' appears as a ' + material + ' ' + ARCH_NOUN[archetype] + ' that ' + behavior + '.';
    document.getElementById('out-meta').innerHTML =
      'job: ' + (job ? job : '<em>(none given)</em>') + '<br>' +
      'reading: ' + cat + ' &middot; form: ' + archetype;

    // svg (reseed from the same base seed so it's deterministic)
    renderForm(document.getElementById('svg'), archetype, seed, 'main');

    document.getElementById('output').classList.remove('hidden');
    document.getElementById('gallery').classList.add('hidden');
  }

  // render every archetype at once, each seeded from name/job/nonce
  function showAll() {
    var name = (document.getElementById('name').value || '').trim() || 'servitor';
    var job = (document.getElementById('job').value || '').trim();
    var gallery = document.getElementById('gallery');
    gallery.innerHTML = '';
    Object.keys(DRAW).forEach(function (key) {
      var tile = document.createElement('div');
      tile.className = 'tile';
      var svg = el('svg', { viewBox: '0 0 400 400' });
      renderForm(svg, key, hashString(name + '|' + job + '|' + nonce + '|' + key), key);
      tile.appendChild(svg);
      var lbl = document.createElement('div');
      lbl.className = 'lbl';
      lbl.textContent = ARCH_NOUN[key];
      tile.appendChild(lbl);
      gallery.appendChild(tile);
    });
    gallery.classList.remove('hidden');
    document.getElementById('output').classList.add('hidden');
  }

  // ---- wiring ----
  document.getElementById('generate').addEventListener('click', function () { nonce = 0; generate(); });
  document.getElementById('reroll').addEventListener('click', function () {
    nonce++;
    if (!document.getElementById('gallery').classList.contains('hidden')) showAll();
    else generate();
  });
  document.getElementById('showall').addEventListener('click', showAll);
  document.getElementById('save').addEventListener('click', function () {
    var svg = document.getElementById('svg');
    if (!svg.firstChild) return;
    var blob = new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = ((document.getElementById('name').value || 'servitor').trim() || 'servitor') + '-form.svg';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  var swatches = document.querySelectorAll('#palette .swatch');
  swatches.forEach(function (sw) {
    sw.addEventListener('click', function () {
      swatches.forEach(function (s) { s.classList.remove('active'); });
      sw.classList.add('active');
      palette.ink = sw.getAttribute('data-ink');
      palette.accent = sw.getAttribute('data-accent');
      if (!document.getElementById('gallery').classList.contains('hidden')) showAll();
      else if (!document.getElementById('output').classList.contains('hidden')) generate();
    });
  });

  document.getElementById('job').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { nonce = 0; generate(); }
  });
})();
</script>
</body>
