<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigil Forge</title>
<style>
  :root {
    --bg: #0b0a10;
    --panel: #15131e;
    --ink: #e8e2d0;
    --gold: #c9a84c;
    --dim: #6f6a7e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #181425 0%, var(--bg) 70%);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 {
    font-weight: normal;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 1.4rem;
    color: var(--gold);
    margin-bottom: 0.3rem;
  }
  .subtitle { color: var(--dim); font-size: 0.85rem; font-style: italic; margin-bottom: 1.5rem; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
    margin-bottom: 1rem;
    max-width: 640px;
    width: 100%;
  }
  input[type="text"] {
    flex: 1 1 280px;
    background: var(--panel);
    border: 1px solid #2c2840;
    color: var(--ink);
    font-family: inherit;
    font-size: 1rem;
    padding: 0.65rem 0.9rem;
    border-radius: 4px;
    outline: none;
    letter-spacing: 0.05em;
  }
  input[type="text"]:focus { border-color: var(--gold); }
  button {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.65rem 1.1rem;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  button:hover { background: var(--gold); color: var(--bg); }
  button.secondary { border-color: #3a3550; color: var(--dim); }
  button.secondary:hover { background: #3a3550; color: var(--ink); }
  .method-toggle { display: flex; gap: 0; margin-bottom: 1.2rem; }
  .method-toggle button {
    border-radius: 0;
    border-color: #3a3550;
    color: var(--dim);
  }
  .method-toggle button:first-child { border-radius: 4px 0 0 4px; }
  .method-toggle button:last-child { border-radius: 0 4px 4px 0; border-left: none; }
  .method-toggle button.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--bg);
  }
  .palette {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.55rem;
    align-items: center;
    margin-bottom: 1.2rem;
    max-width: 480px;
  }
  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s, border-color 0.15s;
  }
  .swatch:hover { transform: scale(1.15); background: inherit; }
  .swatch.active { border-color: var(--ink); transform: scale(1.15); }
  .palette input[type="color"] {
    width: 26px;
    height: 26px;
    border: 2px solid #3a3550;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    padding: 0;
  }
  .palette input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  .palette input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
  .chaos-row {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 1.2rem;
    color: var(--dim);
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .chaos-row input[type="range"] {
    width: 160px;
    accent-color: var(--gold);
    cursor: pointer;
  }
  .chaos-row #chaos-val { min-width: 2.2em; color: var(--gold); }
  .chaos-row button { padding: 0.35rem 0.8rem; font-size: 0.75rem; }
  .letters {
    color: var(--dim);
    font-size: 0.9rem;
    letter-spacing: 0.5em;
    margin-bottom: 1rem;
    min-height: 1.2em;
    text-transform: uppercase;
  }
  .letters span.kept { color: var(--gold); }
  #stage {
    width: min(520px, 92vw);
    aspect-ratio: 1;
    background: var(--panel);
    border: 1px solid #2c2840;
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(201, 168, 76, 0.06);
  }
  #stage svg { width: 100%; height: 100%; display: block; }
  .export-row { display: flex; gap: 0.6rem; margin-top: 1rem; }
  .hint { color: var(--dim); font-size: 0.78rem; margin-top: 1.2rem; font-style: italic; }
</style>
</head>
<body>

<div class="nav" style="margin-bottom:1.4rem;font-size:0.8rem;letter-spacing:0.2em;text-transform:uppercase;">
  <a href="index.html" style="color:var(--gold);text-decoration:none;">Sigil Forge</a> &nbsp;·&nbsp;
  <a href="invoke.html" style="color:var(--dim);text-decoration:none;">Invocation Guide</a> &nbsp;·&nbsp;
  <a href="manifest.html" style="color:var(--dim);text-decoration:none;">The Working</a>
</div>

<h1>Sigil Forge</h1>
<div class="subtitle">speak your intent, receive its mark</div>

<div class="controls">
  <input type="text" id="phrase" placeholder="enter your phrase of intent..."
         value="manifest wealth" autocomplete="off">
  <button id="forge">Forge</button>
</div>

<div class="method-toggle">
  <button id="btn-rose" class="active">Rose Wheel</button>
  <button id="btn-overlay">Letter Overlay</button>
</div>

<div class="palette" id="palette">
  <button class="swatch active" data-ink="#e8e2d0" data-accent="#c9a84c" style="background:#e8e2d0" title="Bone &amp; Gold"></button>
  <button class="swatch" data-ink="#c9a84c" data-accent="#8a6d2f" style="background:#c9a84c" title="Gold"></button>
  <button class="swatch" data-ink="#c0392b" data-accent="#7a241b" style="background:#c0392b" title="Crimson"></button>
  <button class="swatch" data-ink="#9b59d0" data-accent="#5e3580" style="background:#9b59d0" title="Violet"></button>
  <button class="swatch" data-ink="#3ec6b8" data-accent="#1f7a71" style="background:#3ec6b8" title="Teal"></button>
  <button class="swatch" data-ink="#f7c6d9" data-accent="#d98aa8" style="background:#f7c6d9" title="Pastel Pink"></button>
  <button class="swatch" data-ink="#cdb4f0" data-accent="#9a7fc4" style="background:#cdb4f0" title="Pastel Purple"></button>
  <button class="swatch" data-ink="glitter" data-accent="#e8b6ff" style="background:linear-gradient(135deg,#ffd1ec,#e8b6ff 30%,#b5e8ff 60%,#ffe9b5)" title="Glitter"></button>
  <button class="swatch" data-ink="#9fe2cf" data-accent="#5fb39e" style="background:#9fe2cf" title="Seafoam"></button>
  <button class="swatch" data-ink="#ff2d95" data-accent="#b01060" style="background:#ff2d95" title="Hot Pink"></button>
  <button class="swatch" data-ink="#5e2b8a" data-accent="#8e5bc0" style="background:#5e2b8a" title="Dark Purple"></button>
  <input type="color" id="custom-color" value="#e8e2d0" title="Custom color">
</div>

<div class="chaos-row">
  <label for="chaos">Chaos</label>
  <input type="range" id="chaos" min="0" max="100" value="0">
  <span id="chaos-val">0</span>
  <button class="secondary" id="reroll">Reroll</button>
</div>

<div class="letters" id="letters"></div>

<div id="stage"></div>

<div class="export-row">
  <button class="secondary" id="dl-svg">Save SVG</button>
  <button class="secondary" id="dl-png">Save PNG</button>
</div>

<div class="hint">vowels and repeated letters are cast away; what remains becomes the sigil</div>

<script>
(function () {
  'use strict';

  var SIZE = 600;
  var CX = SIZE / 2, CY = SIZE / 2;
  var state = {
    method: 'rose',
    phrase: '',
    ink: '#e8e2d0',     // sigil stroke color
    accent: '#c9a84c',  // frame / decoration color
    chaos: 0,           // 0-100 geometric disorder
    nonce: 0            // reroll counter, part of the chaos seed
  };

  // deterministic RNG seeded from phrase + nonce, so a given
  // phrase at a given chaos roll always yields the same sigil
  var rng = Math.random;

  function hashString(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    }
    return h >>> 0;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---- distillation: strip vowels, strip duplicates ----
  function distill(phrase) {
    var letters = phrase.toUpperCase().replace(/[^A-Z]/g, '').split('');
    var vowels = { A: 1, E: 1, I: 1, O: 1, U: 1 };
    var seen = {};
    var kept = [];
    letters.forEach(function (ch) {
      if (vowels[ch] || seen[ch]) return;
      seen[ch] = 1;
      kept.push(ch);
    });
    return { all: letters, kept: kept };
  }

  // ---- rose wheel: letters on three concentric rings ----
  // A-I outer ring, J-R middle ring, S-Z inner ring (classic witch's-wheel layout)
  function wheelPosition(ch) {
    var idx = ch.charCodeAt(0) - 65;
    var ring, posInRing, ringSize, radius;
    if (idx < 9)       { ring = 0; posInRing = idx;      ringSize = 9; radius = 190; }
    else if (idx < 18) { ring = 1; posInRing = idx - 9;  ringSize = 9; radius = 130; }
    else               { ring = 2; posInRing = idx - 18; ringSize = 8; radius = 72;  }
    // offset each ring's starting angle so rings interleave
    var angle = (posInRing / ringSize) * Math.PI * 2 - Math.PI / 2 + ring * 0.35;
    return {
      x: CX + radius * Math.cos(angle),
      y: CY + radius * Math.sin(angle)
    };
  }

  function svgEl(tag, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  // glitter ink renders as an iridescent gradient stroke plus sparkles
  function resolveInk(svg) {
    if (state.ink !== 'glitter') return state.ink;
    var defs = svgEl('defs', {});
    var grad = svgEl('linearGradient', {
      id: 'glitterGrad', x1: '0%', y1: '0%', x2: '100%', y2: '100%'
    });
    [['0%', '#ffd1ec'], ['25%', '#e8b6ff'], ['50%', '#b5e8ff'],
     ['75%', '#ffe9b5'], ['100%', '#ffb6d9']].forEach(function (s) {
      grad.appendChild(svgEl('stop', { offset: s[0], 'stop-color': s[1] }));
    });
    defs.appendChild(grad);
    svg.appendChild(defs);
    return 'url(#glitterGrad)';
  }

  function addSparkles(svg) {
    if (state.ink !== 'glitter') return;
    var colors = ['#ffffff', '#ffd1ec', '#b5e8ff', '#ffe9b5'];
    for (var i = 0; i < 40; i++) {
      var angle = Math.random() * Math.PI * 2;
      var dist = Math.random() * 235;
      var x = CX + dist * Math.cos(angle);
      var y = CY + dist * Math.sin(angle);
      var r = 1 + Math.random() * 2.2;
      if (Math.random() < 0.35) {
        // four-point star
        var s = r * 3;
        svg.appendChild(svgEl('path', {
          d: 'M' + x + ' ' + (y - s) +
             ' Q' + x + ' ' + y + ' ' + (x + s) + ' ' + y +
             ' Q' + x + ' ' + y + ' ' + x + ' ' + (y + s) +
             ' Q' + x + ' ' + y + ' ' + (x - s) + ' ' + y +
             ' Q' + x + ' ' + y + ' ' + x + ' ' + (y - s) + ' Z',
          fill: colors[i % colors.length],
          opacity: 0.4 + Math.random() * 0.6
        }));
      } else {
        svg.appendChild(svgEl('circle', {
          cx: x, cy: y, r: r,
          fill: colors[i % colors.length],
          opacity: 0.3 + Math.random() * 0.5
        }));
      }
    }
  }

  // stray occult marks that bleed in as chaos rises
  function chaosMarks(svg, ink) {
    var count = Math.round(state.chaos / 14); // up to ~7 marks
    for (var i = 0; i < count; i++) {
      var angle = rng() * Math.PI * 2;
      var dist = 60 + rng() * 175;
      var x = CX + dist * Math.cos(angle);
      var y = CY + dist * Math.sin(angle);
      var kind = rng();
      var op = 0.35 + rng() * 0.4;
      if (kind < 0.4) {
        // tick: short line at a random angle
        var a2 = rng() * Math.PI * 2, L = 8 + rng() * 16;
        svg.appendChild(svgEl('line', {
          x1: x - Math.cos(a2) * L, y1: y - Math.sin(a2) * L,
          x2: x + Math.cos(a2) * L, y2: y + Math.sin(a2) * L,
          stroke: ink, 'stroke-width': 2, 'stroke-linecap': 'round', opacity: op
        }));
      } else if (kind < 0.7) {
        // small open ring
        svg.appendChild(svgEl('circle', {
          cx: x, cy: y, r: 4 + rng() * 8, fill: 'none',
          stroke: ink, 'stroke-width': 1.8, opacity: op
        }));
      } else {
        // dot
        svg.appendChild(svgEl('circle', {
          cx: x, cy: y, r: 2 + rng() * 3, fill: ink, opacity: op
        }));
      }
    }
  }

  function makeFrame(svg) {
    svg.appendChild(svgEl('circle', {
      cx: CX, cy: CY, r: 270, fill: 'none', stroke: state.accent,
      'stroke-width': 1.5, opacity: 0.5
    }));
    svg.appendChild(svgEl('circle', {
      cx: CX, cy: CY, r: 258, fill: 'none', stroke: state.accent,
      'stroke-width': 0.75, opacity: 0.35
    }));
  }

  // ---- method 1: rose wheel path ----
  function renderRose(svg, kept) {
    var ink = resolveInk(svg);
    makeFrame(svg);
    if (kept.length === 0) return;

    // chaos drifts each point off its true wheel position
    var amp = state.chaos;
    var pts = kept.map(wheelPosition).map(function (p) {
      return {
        x: p.x + (rng() - 0.5) * amp * 0.9,
        y: p.y + (rng() - 0.5) * amp * 0.9
      };
    });

    // each segment is its own path so chaos can vary the stroke width,
    // like a pen pressing harder and lighter as it moves
    var segs = [];
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i];
      var d = 'M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1);
      if (amp === 0) {
        d += ' L' + b.x.toFixed(1) + ' ' + b.y.toFixed(1);
      } else {
        var dx = b.x - a.x, dy = b.y - a.y;
        var mag = Math.sqrt(dx * dx + dy * dy) || 1;
        var bend = (rng() - 0.5) * amp * 1.6;
        var qx = (a.x + b.x) / 2 - dy / mag * bend;
        var qy = (a.y + b.y) / 2 + dx / mag * bend;
        d += ' Q' + qx.toFixed(1) + ' ' + qy.toFixed(1) +
             ' ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1);
      }
      var w = Math.min(7, Math.max(0.8, 3 + (rng() - 0.5) * amp * 0.06));
      var seg = svgEl('path', {
        d: d, fill: 'none', stroke: ink, 'stroke-width': w,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round'
      });
      svg.appendChild(seg);
      segs.push(seg);
    }

    // staggered draw animation: each segment draws in turn
    var total = 0;
    var lens = segs.map(function (p) { var L = p.getTotalLength(); total += L; return L; });
    var elapsed = 0;
    segs.forEach(function (p, idx) {
      p.style.strokeDasharray = lens[idx];
      p.style.strokeDashoffset = lens[idx];
      p.getBoundingClientRect(); // force layout so the transition fires
      p.style.transition = 'stroke-dashoffset ' + (lens[idx] / total * 1.6).toFixed(3) +
                           's linear ' + (elapsed / total * 1.6).toFixed(3) + 's';
      p.style.strokeDashoffset = '0';
      elapsed += lens[idx];
    });

    // start marker: small circle
    svg.appendChild(svgEl('circle', {
      cx: pts[0].x, cy: pts[0].y, r: 7, fill: 'none',
      stroke: ink, 'stroke-width': 2.5
    }));

    // end marker: crossbar perpendicular to the final segment
    if (pts.length > 1) {
      var a = pts[pts.length - 2], b = pts[pts.length - 1];
      var dx = b.x - a.x, dy = b.y - a.y;
      var mag = Math.sqrt(dx * dx + dy * dy) || 1;
      var px = -dy / mag * 11, py = dx / mag * 11;
      svg.appendChild(svgEl('line', {
        x1: b.x - px, y1: b.y - py, x2: b.x + px, y2: b.y + py,
        stroke: ink, 'stroke-width': 3, 'stroke-linecap': 'round'
      }));
    }

    chaosMarks(svg, ink);
    addSparkles(svg);
  }

  // ---- method 2: letter overlay ----
  function renderOverlay(svg, kept) {
    var ink = resolveInk(svg);
    makeFrame(svg);
    if (kept.length === 0) return;

    var n = kept.length;
    var amp = state.chaos;
    kept.forEach(function (ch, i) {
      // rotate each letterform around the center; spread over 180 degrees
      // so mirrored strokes interlock instead of just spinning in a ring
      // chaos tilts each letter off its slot and shoves it off-center
      var rotation = (180 / n) * i + (rng() - 0.5) * amp * 0.8;
      var ox = (rng() - 0.5) * amp * 0.7;
      var oy = (rng() - 0.5) * amp * 0.7;
      var w = Math.min(6, Math.max(0.8, 2.5 + (rng() - 0.5) * amp * 0.05));
      var t = svgEl('text', {
        x: CX + ox, y: CY + oy,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        'font-family': 'Georgia, serif',
        'font-size': 300,
        fill: 'none',
        stroke: ink,
        'stroke-width': w,
        opacity: 0.9,
        transform: 'rotate(' + rotation + ' ' + CX + ' ' + CY + ')'
      });
      t.textContent = ch;
      svg.appendChild(t);
    });

    // center anchor dot
    svg.appendChild(svgEl('circle', { cx: CX, cy: CY, r: 4, fill: state.accent }));

    chaosMarks(svg, ink);
    addSparkles(svg);
  }

  // ---- render dispatch ----
  function render() {
    var result = distill(state.phrase);
    rng = mulberry32(hashString(result.kept.join('') + '|' + state.nonce + '|' + state.chaos));

    // show which letters survived
    var lettersDiv = document.getElementById('letters');
    lettersDiv.innerHTML = '';
    var shown = {};
    result.all.forEach(function (ch) {
      var span = document.createElement('span');
      span.textContent = ch;
      var isKept = result.kept.indexOf(ch) !== -1 && !shown[ch];
      if (isKept) { span.className = 'kept'; shown[ch] = 1; }
      else { span.style.textDecoration = 'line-through'; span.style.opacity = '0.4'; }
      lettersDiv.appendChild(span);
    });

    var svg = svgEl('svg', {
      viewBox: '0 0 ' + SIZE + ' ' + SIZE,
      xmlns: 'http://www.w3.org/2000/svg'
    });
    svg.appendChild(svgEl('rect', { width: SIZE, height: SIZE, fill: '#15131e' }));

    if (state.method === 'rose') renderRose(svg, result.kept);
    else renderOverlay(svg, result.kept);

    var stage = document.getElementById('stage');
    stage.innerHTML = '';
    stage.appendChild(svg);
  }

  // ---- exports ----
  function currentSvgString() {
    var svg = document.querySelector('#stage svg');
    return svg ? new XMLSerializer().serializeToString(svg) : null;
  }

  function fileStem() {
    var d = distill(state.phrase);
    return 'sigil-' + (d.kept.join('').toLowerCase() || 'empty');
  }

  function downloadSvg() {
    var s = currentSvgString();
    if (!s) return;
    var blob = new Blob([s], { type: 'image/svg+xml' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileStem() + '.svg';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function downloadPng() {
    var s = currentSvgString();
    if (!s) return;
    var img = new Image();
    var blob = new Blob([s], { type: 'image/svg+xml' });
    var url = URL.createObjectURL(blob);
    img.onload = function () {
      var canvas = document.createElement('canvas');
      canvas.width = 1200;
      canvas.height = 1200;
      canvas.getContext('2d').drawImage(img, 0, 0, 1200, 1200);
      URL.revokeObjectURL(url);
      var a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = fileStem() + '.png';
      a.click();
    };
    img.src = url;
  }

  // ---- wiring ----
  function forge() {
    state.phrase = document.getElementById('phrase').value;
    render();
  }

  function setMethod(m) {
    state.method = m;
    document.getElementById('btn-rose').classList.toggle('active', m === 'rose');
    document.getElementById('btn-overlay').classList.toggle('active', m === 'overlay');
    render();
  }

  document.getElementById('forge').addEventListener('click', forge);
  document.getElementById('phrase').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') forge();
  });
  document.getElementById('btn-rose').addEventListener('click', function () { setMethod('rose'); });
  document.getElementById('btn-overlay').addEventListener('click', function () { setMethod('overlay'); });
  document.getElementById('dl-svg').addEventListener('click', downloadSvg);
  document.getElementById('dl-png').addEventListener('click', downloadPng);

  var swatches = document.querySelectorAll('#palette .swatch');
  swatches.forEach(function (sw) {
    sw.addEventListener('click', function () {
      state.ink = sw.getAttribute('data-ink');
      state.accent = sw.getAttribute('data-accent');
      swatches.forEach(function (s) { s.classList.remove('active'); });
      sw.classList.add('active');
      render();
    });
  });

  document.getElementById('chaos').addEventListener('input', function (e) {
    state.chaos = parseInt(e.target.value, 10);
    document.getElementById('chaos-val').textContent = state.chaos;
    render();
  });

  document.getElementById('reroll').addEventListener('click', function () {
    state.nonce++;
    render();
  });

  document.getElementById('custom-color').addEventListener('input', function (e) {
    state.ink = e.target.value;
    state.accent = e.target.value;
    swatches.forEach(function (s) { s.classList.remove('active'); });
    render();
  });

  var incoming = new URLSearchParams(location.search).get('phrase');
  if (incoming) document.getElementById('phrase').value = incoming;
  forge();
})();
</script>
